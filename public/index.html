<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Arena - Protected Learning Platform</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at top, #1E1B4B 0%, #070B14 70%);
        color: #F8FAFC;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .card {
        text-align: center;
        padding: 2.5rem;
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(12px);
        border-radius: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
        max-width: 440px;
        width: 100%;
      }
      .shield-icon {
        width: 64px;
        height: 64px;
        border-radius: 32px;
        background: rgba(99, 102, 241, 0.15);
        color: #818CF8;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem 0;
        color: #FFFFFF;
        font-weight: 700;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        color: #10B981;
        background: rgba(16, 185, 129, 0.15);
        padding: 4px 10px;
        border-radius: 20px;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      p {
        color: #94A3B8;
        margin: 0 0 1.5rem 0;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .btn {
        display: block;
        background: #6366F1;
        color: #FFFFFF;
        text-decoration: none;
        padding: 0.85rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 1rem;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #4F46E5;
        transform: translateY(-1px);
      }
      .secondary {
        margin-top: 1rem;
        font-size: 0.85rem;
        color: #64748B;
      }
    </style>
</head>
<body>
    <div class="card">
        <div class="shield-icon">🔒</div>
        <div class="badge">Protected Course Content</div>
        <h1 id="title">Course Arena</h1>
        <p id="desc">This course is protected by content security rules and can only be opened inside the Course Arena mobile app.</p>
        <a id="appBtn" href="coursearena://" class="btn">Open in Course Arena App</a>
        <div class="secondary">Opening in external web browsers is restricted.</div>
    </div>

    <script>
      (function() {
        var path = window.location.pathname;
        var appUrl = "coursearena://" + (path.startsWith('/') ? path.substring(1) : path);

        var appBtn = document.getElementById("appBtn");
        appBtn.href = appUrl;

        // Automatically trigger app opening if a specific course or route was accessed
        if (path && path !== '/' && path !== '/index.html') {
          window.location.href = appUrl;
        }
      })();
    </script>
</body>
</html>
